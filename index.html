<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبتي القانونية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1726; --text:#eef1f7; --muted:#9aa6bd; --card:#16213a; --line:#243252;
  --head:"Reem Kufi","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--text);font-family:var(--body);line-height:1.7;overflow-x:hidden;
  padding:max(24px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}

/* خلفية بتتحرك ببطء */
.blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-1;
  animation:drift 22s ease-in-out infinite alternate}
.b1{background:#3ecf9a;top:-18vmax;right:-14vmax}
.b2{background:#5aa8ff;bottom:-20vmax;left:-14vmax;animation-delay:-8s}
.b3{background:#c58cff;top:35%;left:30%;width:30vmax;height:30vmax;opacity:.16;animation-delay:-14s}
@keyframes drift{to{transform:translate(6vmax,5vmax) scale(1.15)}}

main{max-width:960px;margin:0 auto}
header{padding:clamp(36px,9vh,90px) 0 36px;text-align:center}
h1{font-family:var(--head);font-weight:700;font-size:clamp(2.4rem,8vw,4.6rem);line-height:1.2;letter-spacing:0}
h1 span{display:inline-block;opacity:0;transform:translateY(.6em) rotate(3deg);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
header p{color:var(--muted);margin-top:12px;font-size:1.05rem;opacity:0;animation:rise .8s .7s forwards}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;perspective:900px}
.card{--c:#fff;position:relative;display:flex;flex-direction:column;gap:14px;padding:24px;min-height:190px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;color:inherit;text-decoration:none;
  overflow:hidden;transform-style:preserve-3d;transition:transform .25s ease,border-color .25s,box-shadow .25s;
  opacity:0;animation:rise .6s forwards;animation-delay:calc(.9s + var(--i)*.09s)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--c) 26%,transparent),transparent 70%);
  opacity:0;transition:opacity .3s}
.card:hover,.card:focus-visible{border-color:var(--c);box-shadow:0 14px 40px -18px var(--c)}
.card:hover::before,.card:focus-visible::before{opacity:1}
.card:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);transition:transform .35s}
.card:hover .icon{transform:rotate(-8deg) scale(1.1)}
.icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h2{font-family:var(--head);font-size:1.45rem;font-weight:600;line-height:1.4}
.go{margin-top:auto;display:flex;align-items:center;gap:8px;color:var(--c);font-weight:500}
.go svg{width:18px;height:18px;fill:currentColor;transition:transform .25s}
.card:hover .go svg{transform:translateX(-5px) scale(1.15)}
.last{position:absolute;top:18px;left:18px;font-size:.78rem;padding:2px 10px;border-radius:99px;
  background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c);display:none}
.card.is-last .last{display:block}

footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:44px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  h1 span,header p,.card{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<main>
  <header>
    <h1 id="title">مكتبتي القانونية</h1>
    <p>خمس مواد، كل واحدة على بُعد ضغطة</p>
  </header>
  <section class="grid" id="grid" aria-label="قوائم التشغيل"></section>
  <footer>الروابط بتفتح على يوتيوب في تبويب جديد</footer>
</main>

<script>
/* عدّل الروابط من هنا بس */
const PLAYLISTS = [
  {name:"الشريعة الإسلامية",       url:"https://youtube.com/playlist?list=PLGQ7yNceV-5g&si=JDamP4zxt8XBT8tW",   color:"#3ecf9a", icon:"book"},
  {name:"القانون الدولي الخاص",    url:"https://youtube.com/playlist?list=PLE7d3kh4gw3k&si=0wmug8sKzo5hkeV5",   color:"#5aa8ff", icon:"globe"},
  {name:"القانون التجاري",         url:"https://youtube.com/playlist?list=PLXwz4zqcgg0o&si=CV32wg_QVffsehl0",   color:"#ffb454", icon:"case"},
  {name:"المالية العامة والتشريع الضريبي", url:"https://youtube.com/playlist?list=PLRfxxrNbcV_A&si=GXSbWOsGZMn0nLy-", color:"#c58cff", icon:"bank"},
  {name:"القضاء الإداري",          url:"https://youtube.com/playlist?list=PLEx5LgXaTQsA&si=UFVJKGBWr_elqfjq",   color:"#ff7a8a", icon:"scale"}
];

const ICONS = {
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  case:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>',
  bank:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 21h18"/>',
  scale:'<path d="M12 3v18M5 21h14M6 7h12M6 7l-3 7a3 3 0 0 0 6 0zM18 7l-3 7a3 3 0 0 0 6 0z"/>'
};

/* عنوان بيظهر كلمة كلمة */
const t = document.getElementById("title");
t.innerHTML = t.textContent.split(" ").map((w,i)=>`<span style="animation-delay:${i*.18}s">${w}</span>`).join(" ");

let lastUrl = "";
try { lastUrl = localStorage.getItem("lastPlaylist") || ""; } catch(e){}

const grid = document.getElementById("grid");
PLAYLISTS.forEach((p,i)=>{
  const a = document.createElement("a");
  a.className = "card" + (p.url === lastUrl ? " is-last" : "");
  a.href = p.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.style.setProperty("--c", p.color); a.style.setProperty("--i", i);
  a.innerHTML = `
    <span class="last">آخر واحدة فتحتها</span>
    <div class="icon"><svg viewBox="0 0 24 24">${ICONS[p.icon]}</svg></div>
    <h2>${p.name}</h2>
    <span class="go"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>افتح القائمة</span>`;
  a.addEventListener("click", ()=>{
    try { localStorage.setItem("lastPlaylist", p.url); } catch(e){}
    document.querySelectorAll(".card").forEach(c=>c.classList.remove("is-last"));
    a.classList.add("is-last");
  });
  grid.appendChild(a);
});

/* ميل خفيف للكارت مع حركة الماوس */
const still = matchMedia("(prefers-reduced-motion:reduce)").matches || matchMedia("(hover:none)").matches;
if(!still){
  grid.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("pointermove",e=>{
      const r = c.getBoundingClientRect();
      const x = (e.clientX-r.left)/r.width, y = (e.clientY-r.top)/r.height;
      c.style.setProperty("--mx",x*100+"%"); c.style.setProperty("--my",y*100+"%");
      c.style.transform = `rotateY(${(x-.5)*-8}deg) rotateX(${(y-.5)*8}deg) translateY(-4px)`;
    });
    c.addEventListener("pointerleave",()=>{c.style.transform="";});
  });
}
</script>
</body>
</html>
